services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: leads
      POSTGRES_PASSWORD: leads
      POSTGRES_DB: leads
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leads -d leads"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: base
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://leads:leads@db:5432/leads
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      target: base
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://leads:leads@db:5432/leads
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  tests:
    build:
      context: .
      target: dev
    environment:
      TEST_DATABASE_URL: postgresql+psycopg2://leads:leads@db:5432/leads_test
    command: ["pytest", "-q"]
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tests"]

volumes:
  pgdata:
