[project]
name = "enriquecimento-leads"
version = "0.1.0"
description = "Enriquecimento automático de contatos do HubSpot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "tenacity>=8.5,<10",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0.30,<2.2",
    "psycopg2-binary>=2.9,<3",
    "alembic>=1.13,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # Aviso interno do TestClient do Starlette, sem efeito nos testes.
    "ignore:Using `httpx` with `starlette.testclient`",
]
markers = [
    "integration: testes que exigem PostgreSQL (TEST_DATABASE_URL)",
]
